<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Language Learning Lab</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif; margin:0; background:#0f172a; color:#e2e8f0; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px; }
    .card { background:#111827; border:1px solid #243042; border-radius:20px; padding:28px; }
    h1 { margin:0 0 12px; font-size: 34px; }
    p { line-height: 1.7; color:#cbd5e1; }
    .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); margin-top:24px; }
    .box { background:#0b1220; border:1px solid #243042; border-radius:16px; padding:18px; }
    .btn { display:inline-block; margin-top:12px; padding:10px 14px; border-radius:999px; background:#38bdf8; color:#082f49; text-decoration:none; font-weight:700; }
    .muted { color:#94a3b8; font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Language Learning Lab</h1>
      <p>這會是你的互動式語言學習首頁。之後可以放單字卡、對話練習、測驗、發音提示，點按鈕就進下一題。</p>
      <a class="btn" href="#lessons">開始練習</a>

      <div id="lessons" class="grid">
        <div class="box">
          <strong>單字卡</strong>
          <p>看題目、選答案、立刻知道對不對。</p>
        </div>
        <div class="box">
          <strong>情境對話</strong>
          <p>把句子拆成選項，做成簡單互動題。</p>
        </div>
        <div class="box">
          <strong>每日複習</strong>
          <p>把昨天學過的內容整理成短練習。</p>
        </div>
      </div>

      <p class="muted">Next: connect this page to GitHub Pages, then add real interactive flows.</p>
    </div>
  </div>
</body>
</html>
