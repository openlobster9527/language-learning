name: Deploy site with OpenClaw intro subpath

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'README.md'
      - 'daily-lessons.json'
      - 'lesson-bank.json'
      - 'lesson-catalog.json'
      - 'scripts/**'
      - 'language-learning/**'
      - 'openclaw-intro/**'
      - '.github/workflows/openclaw-intro-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site artifact
        run: |
          rm -rf site
          mkdir -p site
          rsync -a --exclude '.git' --exclude '.github' ./ site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
